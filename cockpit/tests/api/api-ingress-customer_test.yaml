suite: Cockpit - API - customer-management ingress config
templates:
  - "api/api-ingress-customer.yaml"
tests:
  - it: should generate nothing when api is disabled
    template: api/api-ingress-customer.yaml
    set:
      api:
        enabled: false
        customerManagement:
          enabled: true
    release:
      name: my-cockpit
      namespace: unittest
    asserts:
      - hasDocuments:
          count: 0

  - it: should generate nothing when customer-management is disabled
    template: api/api-ingress-customer.yaml
    release:
      name: my-cockpit
      namespace: unittest
    asserts:
      - hasDocuments:
          count: 0

  - it: should generate nothing when ingress is disabled
    template: api/api-ingress-customer.yaml
    set:
      api:
        customerManagement:
          enabled: true
          ingress:
            enabled: false
    release:
      name: my-cockpit
      namespace: unittest
    asserts:
      - hasDocuments:
          count: 0

  - it: should apply labels
    template: api/api-ingress-customer.yaml
    set:
      api:
        customerManagement:
          enabled: true
    release:
      name: my-cockpit
      namespace: unittest
    chart:
      version: 1.0.0-chart
      appVersion: 1.0.0-app
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/component: api
            app.kubernetes.io/instance: my-cockpit
            app.kubernetes.io/managed-by: Helm
            app.kubernetes.io/name: cockpit
            app.kubernetes.io/version: 1.0.0-app
            helm.sh/chart: cockpit-1.0.0-chart

  - it: should apply default ingress configuration
    template: api/api-ingress-customer.yaml
    set:
      api:
        customerManagement:
          enabled: true
      global:
        kubeVersion: 1.13.0
    release:
      name: my-cockpit
      namespace: unittest
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - isAPIVersion:
          of: extensions/v1beta1
      - equal:
          path: metadata.name
          value: my-cockpit-api-customer
      - equal:
          path: metadata.annotations
          value:
            kubernetes.io/ingress.class: nginx
            nginx.ingress.kubernetes.io/limit-rps: "20"
            nginx.ingress.kubernetes.io/limit-connections: "10"
      - equal:
          path: spec
          value:
            rules:
              - host: cockpit.example.com
                http:
                  paths:
                  - backend:
                      serviceName: my-cockpit-api
                      servicePort: 8065
                    path: /customers
                    pathType: Prefix
            tls:
              - hosts:
                  - cockpit.example.com
                secretName: api-custom-cert

  - it: should support Kubernetes 1.22 version
    template: api/api-ingress-customer.yaml
    set:
      api:
        customerManagement:
          enabled: true
    release:
      name: my-cockpit
      namespace: unittest
    capabilities:
      apiVersions:
        - networking.k8s.io/v1
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - isAPIVersion:
          of: networking.k8s.io/v1
      - equal:
          path: metadata.name
          value: my-cockpit-api-customer
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value:
            name: my-cockpit-api
            port:
              number: 8065

  - it: should apply ingressClassName when set
    template: api/api-ingress-customer.yaml
    set:
      api:
        customerManagement:
          enabled: true
          ingress:
            ingressClassName: nginx
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - isAPIVersion:
          of: networking.k8s.io/v1
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: Check Ingress host with wildcard
    set:
      api:
        customerManagement:
          enabled: true
          ingress:
            hosts:
              - "*.cockpit.example.com"
    asserts:
      - equal:
          path: spec.rules[0].host
          value: "*.cockpit.example.com"
